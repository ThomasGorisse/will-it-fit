name: CI

# Build and unit tests. No deployment, no secrets.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          # Read when a run fails, the same week. Releases are built locally, not here.
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: will-it-fit-debug
          path: app/build/outputs/apk/debug/*.apk
          # A PR's debug APK, to install while it is reviewed.
          retention-days: 14
